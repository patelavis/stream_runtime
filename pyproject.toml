[project]
name = "stream-runtime"
version = "0.1.0"
description = "A disk-streaming AI model inference runtime with strict memory budgeting."
authors = [
    {name = "Patel Avish", email = "avish@example.com"},
]
dependencies = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
